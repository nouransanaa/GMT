spring.application.name=gmt-rentacar
spring.datasource.url=jdbc:postgresql://localhost:5432/gmt_rentacar
spring.datasource.username=postgres
spring.datasource.password=adminadmin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# Replace this development-only key through GMT_JWT_SECRET before deployment.
gmt.jwt.secret=${GMT_JWT_SECRET:GMT-Rental-Dev-Only-Secret-Key-Change-Me-32}
gmt.jwt.expiration=86400000

# Configuration SMTP (Spring Boot Mail)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:true}
gmt.mail.from=${GMT_MAIL_FROM:no-reply@gmt-rental.com}
