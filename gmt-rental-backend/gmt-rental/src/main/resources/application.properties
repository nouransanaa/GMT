spring.application.name=gmt-rentacar
spring.datasource.url=jdbc:postgresql://localhost:5432/gmt_rentacar
spring.datasource.username=postgres
spring.datasource.password=adminadmin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# Replace this development-only key through GMT_JWT_SECRET before deployment.
gmt.jwt.secret=${GMT_JWT_SECRET:GMT-Rental-Dev-Only-Secret-Key-Change-Me-32}
gmt.jwt.expiration=86400000
